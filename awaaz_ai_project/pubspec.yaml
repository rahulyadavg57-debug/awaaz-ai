name: awaaz_ai
description: "Awaaz AI - Hindi Voice Cloning and Text-to-Speech Android App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
